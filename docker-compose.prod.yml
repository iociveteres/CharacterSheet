# The app only: postgres is its own project (the server repo, db/), joined over the
# external `backend` network, so a deploy never touches the database.
services:
  app:
    image: charactersheet-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: charactersheet-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env.production
    networks:
      - backend

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:4000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  backend:
    external: true

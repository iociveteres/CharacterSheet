{{/* Marks of a topic: inline, because the site's CSP takes no data: images. The data is the
   language; the word is the hover title and what a screen reader says. */}}
{{define "forum-pin"}}<span class="forum-mark" role="img" title="{{t . "forum.topics.pinned"}}" aria-label="{{t . "forum.topics.pinned"}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16v6M8 3h8l-1 7 4 4v2H5v-2l4-4z"/></svg></span>{{end}}
{{define "forum-lock"}}<span class="forum-mark" role="img" title="{{t . "forum.topics.closed"}}" aria-label="{{t . "forum.topics.closed"}}">{{template "forum-lock-icon"}}</span>{{end}}
{{define "forum-lock-icon"}}<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>{{end}}

{{define "title"}}{{t .Lang "site.auth.password.title"}}{{end}}
{{define "main"}}
<meta name="referrer" content="no-referrer" />
<form method="POST" action='{{reverseRev "PasswordReset" .Form.Token}}'>
    <input type='hidden' name='csrf_token' value='{{.CSRFToken}}'>
    <input type="hidden" name="token" value="{{.Form.Token}}">
    <div>
        <label>{{t .Lang "site.auth.password.new"}}</label>
        {{with .Form.Errors.newPassword}}
        <label class='error'>{{.}}</label>
        {{end}}
        <input type='password' name='newPassword'>
    </div>
    <div>
        <label>{{t .Lang "site.auth.password.confirm"}}</label>
        {{with .Form.Errors.newPasswordConfirmation}}
        <label class='error'>{{.}}</label>
        {{end}}
        <input type='password' name='newPasswordConfirmation'>
    </div>
    <div>
        <input type='submit' value='{{t .Lang "site.auth.password.submit"}}'>
    </div>
</form>
{{end}}

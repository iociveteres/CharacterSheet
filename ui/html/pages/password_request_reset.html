{{define "title"}}{{t .Lang "site.auth.reset.title"}}{{end}}
{{define "main"}}
{{t .Lang "site.auth.reset.intro"}}<br>
<form method="POST" action='{{reverseRev "PasswordRequestReset"}}'>
    <input type='hidden' name='csrf_token' value='{{.CSRFToken}}'>
    {{range .Form.NonFieldErrors}}
    <div class='error'>{{.}}</div>
    {{end}}
    <div>
        <label>{{t .Lang "site.auth.email"}}</label>
        {{with .Form.Errors.email}}
        <label class='error'>{{.}}</label>
        {{end}}
        <input type='email' name='email' value='{{.Form.Email}}'>
    </div>
    <div>
        <button type="submit" class="button-large">{{t .Lang "site.auth.reset.submit"}}</button>
    </div>
</form>
{{end}}

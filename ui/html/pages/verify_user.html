{{define "title"}}{{t .Lang "site.auth.verify.title"}}{{end}}
{{define "main"}}
<meta name="referrer" content="no-referrer" />
<form method="POST" action='{{reverseRev "UserVerify" .Token}}' data-auto-submit="true">
    <input type='hidden' name='csrf_token' value='{{.CSRFToken}}'>
    {{t .Lang "site.auth.verify.intro"}}<br>
    <input type="hidden" name="token" value="{{.Token}}">
    {{/* activation.js shows data-busy while the request runs. */}}
    <button type="submit" class="button-large" data-busy='{{t .Lang "site.auth.verify.busy"}}'>{{t .Lang "site.auth.verify.submit"}}</button>
</form>
<script type="module" src='/static/js/activation.js?v={{version "js/activation.js"}}'></script>
{{end}}

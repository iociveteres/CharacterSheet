{{define "title"}}{{t .Lang "site.rooms.delete.title"}}{{end}}
{{define "main"}}
<form action='{{reverseRev "RoomDelete" (str .Form.ID)}}' method='POST'>
    <input type='hidden' name='csrf_token' value='{{.CSRFToken}}'>
    <input type='hidden' name='id' value='{{.Form.ID}}'>
    <div>
        {{t .Lang "site.rooms.delete.question"}}
    </div>
    <div>
        <a class="button" href='{{reverseRev "AccountRooms"}}'>{{t .Lang "site.rooms.delete.back"}}</a>
        <input class="muted" type='submit' value='{{t .Lang "site.rooms.delete.submit"}}'>
    </div>
</form>
{{end}}

name: CI

on:
  pull_request:
  workflow_dispatch:
  # Called by deploy.yml: the production image no longer type checks or tests.
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-latest

    # internal/models tests connect to localhost:5432 (see testutils_test.go).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_web
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: test_charactersheet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_web -d test_charactersheet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Gamedata lives in a private repo; go:embed only needs the directory to be non-empty.
      - name: Gamedata placeholder
        run: |
          mkdir -p internal/gamedata/assets
          echo '[]' > internal/gamedata/assets/placeholder.json

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Single copy of signals
        run: npm run check:signals

      - name: tsc
        run: npx tsc --noEmit

      - name: No `in` over the sheet state
        run: npm run check:state

      - name: Sheet folders import only lower layers, the rest only sheet/api.ts
        run: npm run check:layers

      - name: vitest
        run: npx vitest run

      - name: Build
        run: npm run build

  # The client types of the sheet and the room are generated from the Go code,
  # so this job needs both toolchains.
  sheet-state:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Content types, sheet kinds, the room payload and the encounter match the Go code
        run: |
          npm run gen:types
          git diff --exit-code -- ui/static/js/sheet/schema/content.gen.ts ui/static/js/sheet/kinds/kinds.gen.ts ui/static/js/room/payload.gen.ts ui/static/js/room/encounter/types.gen.ts ui/static/js/bestiary/types.gen.ts ui/static/js/bestiary/payload.gen.ts

      # internal/models/sheet_paths_test.go requires the server's shape check to
      # take every path of this file.
      - name: The field paths of the client schemas are up to date
        run: |
          npm run gen:schema-paths
          git diff --exit-code -- internal/models/testdata/schema_paths.json

  # Browser scenarios (e2e/) against a fresh server on the seed of npm run seed.
  # Not blocking for now. Runs only for this workflow itself: deploy.yml calls
  # it with its own event, and github.workflow is then the caller's name.
  e2e:
    if: github.workflow == 'CI' && (github.event_name == 'workflow_dispatch' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: charactersheet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d charactersheet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://e2e:pass@localhost:5432/charactersheet?sslmode=disable
      # The socket accepts only this Origin.
      BASE_URL: http://localhost:4002
      # main.go exits without a port, the mail client without a host; that
      # nothing answers there is only logged.
      SMTP_HOSTNAME: localhost
      SMTP_PORT: "587"
      E2E_BASE: http://localhost:4002
      E2E_AUTH: scripts/perf/.auth-gm.json
      E2E_VIEWER_AUTH: scripts/perf/.auth-player.json
      # The server runs on the gamedata placeholder (e2e/lib/config.ts).
      E2E_NO_GAMEDATA: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The version setup.sh of the server repo installs on production.
      - name: Install migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" migrate
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Migrate
        run: migrate -database "$DATABASE_URL" -path ./migrations up

      - name: npm ci
        run: npm ci

      - name: Build the bundle
        run: npm run build

      - name: Gamedata placeholder
        run: |
          mkdir -p internal/gamedata/assets
          echo '[]' > internal/gamedata/assets/placeholder.json

      # Built first, so the wait below is for the server and not the compiler.
      - name: Start the server
        run: |
          go build -o "$RUNNER_TEMP/web" ./cmd/web
          nohup "$RUNNER_TEMP/web" -addr :4002 -log-level info > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:4002/readiness > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1

      # The seed signs its users in with Chrome, which the runner image has.
      - name: Seed the test room
        run: |
          npm run seed
          echo "E2E_ROOM=$(node -p "require('./scripts/perf/.seed.json').roomId")" >> "$GITHUB_ENV"

      # sheet-width reads the filled sheets of E2E_FULL_ROOM, which the seed does
      # not make. old-build skips itself without a server on :4001, dev-silence
      # without the watch bundle.
      - name: e2e
        run: npm run test:e2e -- --reporter=dot --exclude e2e/scenarios/ui/sheet-width.e2e.ts

      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log"

name: Deploy to production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  APP_IMAGE: charactersheet-app:latest
  ROLLBACK_IMAGE: charactersheet-app:rollback

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch gamedata (best-effort)
        id: gamedata_clone
        continue-on-error: true
        env:
          GAMEDATA_REPO_URL: ${{ secrets.GAMEDATA_REPO_URL }}
        run: |
          rm -rf internal/gamedata/assets
          git clone "$GAMEDATA_REPO_URL" internal/gamedata/assets

      - name: Ensure gamedata fallback
        run: |
          if [ ! -d internal/gamedata/assets ] || \
             [ -z "$(find internal/gamedata/assets -maxdepth 1 -type f ! -name '.*' 2>/dev/null)" ]; then
            echo "::warning::gamedata assets missing or empty — building with degraded autocomplete"
            rm -rf internal/gamedata/assets
            mkdir -p internal/gamedata/assets
            echo '[]' > internal/gamedata/assets/placeholder.json
          fi

      - name: Save current image for rollback
        run: |
          CURRENT_IMAGE="$(docker compose -f docker-compose.prod.yml images -q | head -n 1)"

          if [ -n "$CURRENT_IMAGE" ]; then
            docker tag "$CURRENT_IMAGE" "$ROLLBACK_IMAGE"
            echo "Saved current image $CURRENT_IMAGE as $ROLLBACK_IMAGE"
          else
            echo "No existing production image found — rollback unavailable for this deploy"
          fi

      - name: Build new image
        run: |
          docker compose -f docker-compose.prod.yml build

      - name: Run database migrations
        env:
          DB_DSN: ${{ secrets.PROD_DB_DSN }}
        run: |
          migrate -database "$DB_DSN" -path ./migrations up

      - name: Switch to new version
        id: switch
        continue-on-error: true
        run: |
          docker compose -f docker-compose.prod.yml up -d --no-build --pull never

      - name: Health check
        id: health_check
        if: steps.switch.outcome == 'success'
        continue-on-error: true
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://127.0.0.1:4000/readiness > /dev/null; then
              echo "Deploy healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::New version failed readiness check"
          exit 1

      - name: Rollback
        if: steps.health_check.outcome == 'failure'
        run: |
          if ! docker image inspect "$ROLLBACK_IMAGE" > /dev/null 2>&1; then
            echo "::error::Rollback image $ROLLBACK_IMAGE does not exist"
            exit 1
          fi

          echo "Rolling back to previous version"
          docker tag "$ROLLBACK_IMAGE" "$APP_IMAGE"

          docker compose -f docker-compose.prod.yml up -d --no-build --pull never

      - name: Rollback health check
        if: steps.health_check.outcome == 'failure'
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://127.0.0.1:4000/readiness > /dev/null; then
              echo "::error::New deploy failed, but rollback succeeded"
              exit 1
            fi
            sleep 2
          done

          echo "::error::CRITICAL: new deploy failed AND rollback failed"
          exit 1
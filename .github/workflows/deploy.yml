name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  APP_IMAGE: charactersheet-app:latest
  ROLLBACK_IMAGE: charactersheet-app:rollback

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provide production env file
        run: cp /srv/charactersheet/.env.production .env.production

      # The last good clone stays in GAMEDATA_CACHE, so a broken clone does not ship
      # an empty autocomplete; with neither the deploy stops. rsync is not installed
      # on the server (setup.sh of the server repo): the cache is copied anew and
      # renamed into place, so a copy that breaks off leaves the old one whole.
      - name: Fetch gamedata
        env:
          GAMEDATA_REPO_URL: ${{ secrets.GAMEDATA_REPO_URL }}
          GAMEDATA_CACHE: /srv/charactersheet/gamedata-cache
        run: |
          assets=internal/gamedata/assets
          # Black Crusade keeps its catalogs at the top of the folder.
          has_data() { [ -n "$(find "$1" -maxdepth 1 -type f -name '*.json' 2>/dev/null)" ]; }

          rm -rf "$assets"
          if git clone --quiet "$GAMEDATA_REPO_URL" "$assets" && has_data "$assets"; then
            rm -rf "$GAMEDATA_CACHE.new" "$GAMEDATA_CACHE.old"
            cp -a "$assets" "$GAMEDATA_CACHE.new"
            rm -rf "$GAMEDATA_CACHE.new/.git"
            if [ -d "$GAMEDATA_CACHE" ]; then
              mv "$GAMEDATA_CACHE" "$GAMEDATA_CACHE.old"
            fi
            mv "$GAMEDATA_CACHE.new" "$GAMEDATA_CACHE"
            rm -rf "$GAMEDATA_CACHE.old"
            echo "Cloned gamedata, kept a copy in $GAMEDATA_CACHE"
          elif has_data "$GAMEDATA_CACHE"; then
            echo "::warning::Could not clone gamedata: building with the last good copy from $GAMEDATA_CACHE"
            rm -rf "$assets"
            cp -a "$GAMEDATA_CACHE" "$assets"
          else
            echo "::error::No gamedata: the clone failed and $GAMEDATA_CACHE has no copy. Push the data to the server's gamedata repository (server README, section 3) and deploy again."
            exit 1
          fi

      - name: Save current image for rollback
        run: |
          CURRENT_IMAGE="$(docker compose -f docker-compose.prod.yml images -q app | head -n 1)"

          if [ -n "$CURRENT_IMAGE" ]; then
            docker tag "$CURRENT_IMAGE" "$ROLLBACK_IMAGE"
            echo "Saved current image $CURRENT_IMAGE as $ROLLBACK_IMAGE"
          else
            echo "No existing production image found — rollback unavailable for this deploy"
          fi

      - name: Build new image
        run: |
          docker compose -f docker-compose.prod.yml build

      - name: Run database migrations
        env:
          DB_DSN: ${{ secrets.PROD_DB_DSN }}
        run: |
          migrate -database "$DB_DSN" -path ./migrations up

      - name: Switch to new version
        id: switch
        continue-on-error: true
        run: |
          docker compose -f docker-compose.prod.yml up -d --no-build --pull never

      - name: Health check
        id: health_check
        if: steps.switch.outcome == 'success'
        continue-on-error: true
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://127.0.0.1:4000/readiness > /dev/null; then
              echo "Deploy healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::New version failed readiness check"
          exit 1

      - name: Rollback
        if: steps.health_check.outcome == 'failure'
        run: |
          if ! docker image inspect "$ROLLBACK_IMAGE" > /dev/null 2>&1; then
            echo "::error::Rollback image $ROLLBACK_IMAGE does not exist"
            exit 1
          fi

          echo "Rolling back to previous version"
          docker tag "$ROLLBACK_IMAGE" "$APP_IMAGE"

          docker compose -f docker-compose.prod.yml up -d --no-build --pull never

      - name: Rollback health check
        if: steps.health_check.outcome == 'failure'
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://127.0.0.1:4000/readiness > /dev/null; then
              echo "::error::New deploy failed, but rollback succeeded"
              exit 1
            fi
            sleep 2
          done

          echo "::error::CRITICAL: new deploy failed AND rollback failed"
          exit 1

      # Each deploy leaves the previous image dangling and build cache behind;
      # the rollback image is tagged and stays.
      - name: Prune old images
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --filter until=168h